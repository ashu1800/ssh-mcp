[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
dynamic = ["version"]
description = "Local MCP server exposing SSH command execution and SFTP transfers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "asyncssh==2.24.1",
    "cryptography>=42",
    "httpx2>=2.10.0",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "psutil>=6",
]

[tool.setuptools.dynamic]
version = {attr = "ssh_mcp.__version__"}

[project.scripts]
ssh-mcp = "ssh_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "large: 1 GB transfer memory baseline (slow)",
    "live: hits the real credential service / real SSH servers",
]
